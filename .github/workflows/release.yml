name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub Release
      packages: write      # push image to GHCR
      id-token: write      # keyless signing via Sigstore OIDC
      attestations: write  # create build provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── 1. Build & push container image to GHCR ──────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ── 2. Attest build provenance (SLSA level 2) ─────────────────────────
      # Creates a signed attestation in the GHCR OCI registry that links
      # the image digest back to this specific workflow run and source commit.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ── 3. Keyless signing with cosign (Sigstore) ─────────────────────────
      # Signs the image digest using a short-lived OIDC certificate issued to
      # the GitHub Actions workflow identity. No long-lived private key needed.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      # ── 4. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Verify keyless signature (cosign)

            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Verify build provenance attestation (GitHub CLI)

            ```bash
            gh attestation verify \
              oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
              --repo ${{ github.repository }}
            ```
